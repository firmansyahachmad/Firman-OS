name: Validate Firman.OS Web

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/web-check.yml'
  workflow_dispatch:

jobs:
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract inline JavaScript and check page integrity
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.DOTALL | re.IGNORECASE)
          assert len(scripts) == 1, f'Expected one inline script, got {len(scripts)}'
          assert '<!doctype html>' in html.lower()
          assert 'id="startBtn"' in html and 'id="demoBtn"' in html and 'id="stopBtn"' in html
          assert 'https://script.google.com/macros/s/AKfycbzFf8sBJvlZJkIl4ornuOtQhx4OquXulbUdjuceo0bmrEa3vkj3I_4k7qThCrMYxX4U/exec' in html
          assert 'https://www.google.com/maps/dir/' in html
          Path('/tmp/firman-os-inline.js').write_text(scripts[0], encoding='utf-8')
          print('HTML page structure and Web App link verified')
          PY
      - name: Check JavaScript syntax
        run: node --check /tmp/firman-os-inline.js
