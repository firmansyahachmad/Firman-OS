name: Validate Firman.OS Web

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ride.html'
      - '.github/workflows/web-check.yml'
  workflow_dispatch:

jobs:
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HTML pages
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for filename in ('index.html', 'ride.html'):
              html=Path(filename).read_text(encoding='utf-8')
              assert '<!doctype html>' in html.lower()
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.DOTALL|re.IGNORECASE)
              assert len(scripts)==1, (filename,len(scripts))
              Path('/tmp/'+filename+'.js').write_text(scripts[0],encoding='utf-8')
          floating=Path('index.html').read_text(encoding='utf-8')
          ride=Path('ride.html').read_text(encoding='utf-8')
          assert 'documentPictureInPicture.requestWindow' in floating
          assert 'id="openPip"' in floating and 'data-app="jumat"' in floating
          assert 'openMini(state.links.jumat)' in floating
          assert 'f.src=\'about:blank\'' in floating
          assert 'AKfycbzFf8sBJvlZJkIl4ornuOtQhx4OquXulbUdjuceo0bmrEa3vkj3I_4k7qThCrMYxX4U/exec' in floating
          assert 'id="startBtn"' in ride
          print('Two valid Firman.OS entry pages')
          PY
      - name: JavaScript syntax check
        run: |
          node --check /tmp/index.html.js
          node --check /tmp/ride.html.js
