name: Build and Verify Firman.OS V0.3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          ls -la "$SDK"
          ls -la "$SDK/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle clean :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          set -euxo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Firman-OS-V0.3-Android14.apk

      - name: Verify APK archive, signature and metadata
        shell: bash
        run: |
          set -euxo pipefail
          test -s Firman-OS-V0.3-Android14.apk
          unzip -t Firman-OS-V0.3-Android14.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)
          test -n "$BUILD_TOOLS"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs Firman-OS-V0.3-Android14.apk | tee apk-signature.txt
          "$AAPT" dump badging Firman-OS-V0.3-Android14.apk | tee apk-badging.txt
          grep -F "package: name='com.firman.os'" apk-badging.txt
          grep -F "targetSdkVersion:'34'" apk-badging.txt
          sha256sum Firman-OS-V0.3-Android14.apk | tee Firman-OS-V0.3-Android14.sha256

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Firman-OS-V0.3-VERIFIED-Android14
          path: |
            Firman-OS-V0.3-Android14.apk
            Firman-OS-V0.3-Android14.sha256
            apk-badging.txt
            apk-signature.txt
          if-no-files-found: error
