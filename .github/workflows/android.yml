name: Build and Verify Firman.OS V0.3

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle clean :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Firman-OS-V0.3-Android14.apk

      - name: Verify APK
        run: |
          test -s Firman-OS-V0.3-Android14.apk
          unzip -t Firman-OS-V0.3-Android14.apk
          BUILD_TOOLS=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose Firman-OS-V0.3-Android14.apk
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging Firman-OS-V0.3-Android14.apk | tee apk-badging.txt
          grep "package: name='com.firman.os'" apk-badging.txt
          grep "targetSdkVersion:'34'" apk-badging.txt
          sha256sum Firman-OS-V0.3-Android14.apk | tee Firman-OS-V0.3-Android14.sha256

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Firman-OS-V0.3-VERIFIED-Android14
          path: |
            Firman-OS-V0.3-Android14.apk
            Firman-OS-V0.3-Android14.sha256
            apk-badging.txt
          if-no-files-found: error
